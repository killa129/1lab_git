<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фонарь на улице — Canvas + SVG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene-container">
        <canvas id="sceneCanvas" width="600" height="400"></canvas>
        <svg id="lampSvg" width="600" height="400" viewBox="0 0 600 400">
            <rect x="280" y="100" width="10" height="200" fill="#4a4a4a" />
            <rect x="275" y="290" width="20" height="15" fill="#3a3a3a" />
            <path d="M285 110 Q 300 100 320 100 L 340 100" 
                  stroke="#4a4a4a" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M320 100 L 340 100 L 345 120 L 315 120 Z" fill="#2a2a2a" />
            <path d="M315 120 L 310 130 L 350 130 L 345 120" fill="#3d3d3d" />
            <circle cx="330" cy="130" r="7" fill="#f5e56c" />
            <rect x="318" y="95" width="4" height="5" fill="#5a5a5a" />
            <circle cx="330" cy="95" r="3" fill="#5a5a5a" />
        </svg>
    </div>
    <button id="toggleBtn">Включить свет!!!</button>

    <script src="script.js"></script>
</body>
</html>
